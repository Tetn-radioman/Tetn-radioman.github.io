
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R7BD — Personal Website</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #10141c;
            color: #f1f5f9;
            font-family: Arial, sans-serif;
        }

        main {
            text-align: center;
            padding: 30px;
        }

        h1 {
            font-size: clamp(42px, 8vw, 76px);
            margin: 0 0 12px;
            letter-spacing: 3px;
        }

        p {
            color: #94a3b8;
            font-size: 18px;
            margin-bottom: 38px;
        }

        a {
            display: inline-block;
            padding: 15px 34px;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            font-size: 17px;
            transition: background 0.2s, transform 0.2s;
        }

        a:hover {
            background: #3b82f6;
            transform: translateY(-2px);
        }
    </style>
</head>

<body>
    <main>
        <h1>R7BD</h1>
        <p>Personal website</p>

        <a href="https://programs.r7bd.ru">
            Мои программы
        </a>
    </main>
</body>
</html>
