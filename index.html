<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R7BD — Personal Website</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 50% 40%, #1e293b 0%, #0f172a 60%, #080c14 100%);
            color: #e2e8f0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        main {
            text-align: center;
            padding: 48px 32px;
            max-width: 520px;
            width: 100%;
        }

        h1 {
            font-size: clamp(48px, 10vw, 84px);
            font-weight: 800;
            margin: 0 0 16px;
            letter-spacing: 0.08em;
            background: linear-gradient(135deg, #ffffff 0%, #94a3b8 50%, #3b82f6 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.05;
            text-shadow: 0 0 40px rgba(37, 99, 235, 0.15);
        }

        p {
            color: #94a3b8;
            font-size: 18px;
            font-weight: 400;
            letter-spacing: 0.02em;
            margin: 0 0 40px;
            line-height: 1.6;
        }

        a {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 16px 40px;
            border-radius: 12px;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #ffffff;
            text-decoration: none;
            font-size: 17px;
            font-weight: 600;
            letter-spacing: 0.01em;
            box-shadow: 0 4px 24px rgba(37, 99, 235, 0.35), 0 1px 2px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
            will-change: transform;
        }

        a::after {
            content: "→";
            display: inline-block;
            transition: transform 0.2s ease;
            font-size: 18px;
        }

        a:hover {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(37, 99, 235, 0.5), 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        a:hover::after {
            transform: translateX(4px);
        }

        a:active {
            transform: translateY(0);
            box-shadow: 0 2px 12px rgba(37, 99, 235, 0.4);
        }

        a:focus-visible {
            outline: 2px solid #60a5fa;
            outline-offset: 3px;
        }

        @media (prefers-reduced-motion: reduce) {
            a, a::after {
                transition: none;
            }
        }
    </style>
</head>

<body>
    <main>
        <h1>R7BD</h1>
        <p>Personal website</p>

        <a href="https://programs.r7bd.ru">
            Мои программы
        </a>
    </main>
</body>
</html>
